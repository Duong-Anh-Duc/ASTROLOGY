<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="14" fill="#1A1F36"/>
  <!-- Library icon (lucide-style, stroked in gold) scaled to 64x64 grid (lucide native: 24x24 → scale 2x, offset to center) -->
  <g transform="translate(8, 8) scale(2)" stroke="#C9A961" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- book spines: 4 vertical bars like Lucide Library -->
    <line x1="4"  y1="4"  x2="4"  y2="20"/>
    <line x1="8"  y1="8"  x2="8"  y2="20"/>
    <line x1="12" y1="6"  x2="12" y2="20"/>
    <path d="M16 6l4 14"/>
    <!-- base shelf -->
    <line x1="2" y1="20" x2="22" y2="20"/>
  </g>
</svg>
